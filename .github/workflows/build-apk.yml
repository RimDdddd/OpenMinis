name: Build Minis APK (chat background)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules: deps/proot)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Android SDK packages (platform 36 / NDK r28 / CMake)
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.12433566" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.0.12433566" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.0.12433566" >> "$GITHUB_ENV"

      - name: Apply chat-background patch
        run: python3 apply_chat_background.py .

      - name: Build native deps (proot + loaders)
        run: ./deps/build_proot.sh

      - name: Build Alpine rootfs
        run: ./scripts/prepare_android_sandbox.sh

      - name: Build rclone AAR (gomobile)
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Build debug APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minis-chatbg-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
