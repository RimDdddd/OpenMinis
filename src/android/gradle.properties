# [CI] 2 GB was not enough for this module once chat/  grew past a dozen
# thousand-line files: the Kotlin back end died mid-compile with
# "OutOfMemoryError: GC overhead limit exceeded" on an unrelated enum's
# <clinit>, which reads like a compiler bug and is really just a starved heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
